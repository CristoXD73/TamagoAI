<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="Apple Watch, the body, sends your words to your Mac, the brain, which sends its answer back">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .t { font-size: 19px; font-weight: 600; fill: #e6edf3; }
    .s { font-size: 13px; fill: #9198a1; letter-spacing: 0.3px; }
    .l { font-size: 13px; fill: #9198a1; font-style: italic; }
    .box { fill: none; stroke: #6e7681; stroke-width: 1.5; }
    .arrow { stroke: #6e7681; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect class="box" x="20" y="30" width="190" height="100" rx="22"/>
  <text class="t" x="115" y="75">Apple Watch</text>
  <text class="s" x="115" y="100">body · face · voice</text>
  <rect class="box" x="430" y="30" width="190" height="100" rx="22"/>
  <text class="t" x="525" y="75">Your Mac</text>
  <text class="s" x="525" y="100">brain · local AI</text>
  <path class="arrow" d="M226,62 L414,62" marker-end="url(#head)"/>
  <text class="l" x="320" y="52">your words</text>
  <path class="arrow" d="M414,98 L226,98" marker-end="url(#head)"/>
  <text class="l" x="320" y="120">its answer</text>
</svg>
